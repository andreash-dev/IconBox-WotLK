name: Release

on:
  push:
    branches: [main]
    paths:
      - IconBox.toc
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iconbox-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish installable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^## Version: //p' IconBox.toc | tr -d '\r')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          mkdir -p package/IconBox/Textures
          cp IconBox.lua IconBox.toc package/IconBox/
          cp Textures/IconBox.tga package/IconBox/Textures/
          printf 'Extract IconBox into World of Warcraft/Interface/AddOns/.\nRestart WoW and enable IconBox.\nSettings: Shift + right-click the minimap button, or Esc > Interface > AddOns > IconBox.\n' > package/IconBox/README.txt
          cp "docs/releases/$version.md" package/IconBox/CHANGELOG.txt
          (cd package && zip -X -r "../IconBox-$version.zip" IconBox)
          unzip -t "IconBox-$version.zip"
          gh release create "$tag" "IconBox-$version.zip" \
            --target "$GITHUB_SHA" --title "IconBox $version" \
            --notes-file "docs/releases/$version.md" --latest
